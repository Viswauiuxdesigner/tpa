<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Login — Tirupur Photography Association</title>
<meta name="description" content="Member login for the Tirupur Photography Association.">
<meta name="theme-color" content="#14181C">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tirupur Photography Association">
<meta property="og:title" content="Member Login — Tirupur Photography Association">
<meta property="og:description" content="Member login for the Tirupur Photography Association.">
<meta property="og:locale" content="en_IN"><meta property="og:locale:alternate" content="ta_IN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%2314181C'/%3E%3Ccircle cx='20' cy='20' r='9' fill='none' stroke='%23EEEAE2' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='3.5' fill='%23C93A18'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-title-key="t_login" data-title-en="Member Login">
<div id="site-header"></div>
<main id="main"><div class="login-grid">
<div class="login-img"><figure class="ph rvi has-img" data-t="1" role="img" aria-label="Darkroom and film photography equipment"><div class="in" data-par="0.05"><img src="images/login/login-bg.jpg" alt="Darkroom and vintage camera equipment" loading="eager" decoding="async"></div></figure></div>
<div class="login-form"><div>
<p class="eyebrow" data-i18n="l_eyebrow">Members</p><h1 style="font-size:clamp(38px,5vw,64px)" data-i18n="l_h1">Welcome <em>back.</em></h1>
<p class="mid" style="margin:16px 0 32px" data-i18n="l_lead">Sign in with the mobile number registered with the association.</p>
<div class="alert" id="l-alert" role="alert"></div>
<form id="login" novalidate>
<div class="fld"><label for="l-mob" data-i18n="f_mobile">Mobile number</label><input id="l-mob" name="mobile" type="tel" inputmode="numeric" autocomplete="username" maxlength="14" aria-describedby="l-mob-e"><span class="err" id="l-mob-e" role="alert"></span></div>
<div class="fld"><label for="l-pw" data-i18n="f_password">Password</label><div class="pw"><input id="l-pw" name="password" type="password" autocomplete="current-password" aria-describedby="l-pw-e"><button type="button" id="l-show" aria-controls="l-pw" data-i18n="f_show">Show</button></div><span class="err" id="l-pw-e" role="alert"></span></div>
<button class="btn solid" type="submit" id="l-btn" style="width:100%;justify-content:center"><span data-i18n="login_btn">Sign in</span></button>
</form>
<p class="small mid" style="margin-top:24px"><a href="contact.html" id="l-forgot" data-i18n="l_forgot">Forgot your password?</a></p>
<hr class="rule" style="margin:32px 0"><p class="small"><span data-i18n="l_new">Not a member yet?</span> <a class="tlink" href="join.html" data-i18n="join">Join the Association</a></p>
<p class="notice" id="l-demo" style="margin-top:24px" hidden data-i18n="l_demo"><b>Demo mode.</b> No login service is connected, so sign-in cannot succeed here. Set <code>loginUrl</code> in js/config.js.</p>
</div></div></div></main>
<div id="site-footer"></div>
<noscript><p style="padding:24px;text-align:center">This website needs JavaScript for navigation and language switching.</p></noscript>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/ta.js"></script>
<script src="js/forms.js"></script>
</body></html>
